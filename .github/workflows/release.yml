name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm run build

      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Publish Windows Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($package.version)"
          $assets = @(
            Get-ChildItem -Path release -Filter '*.exe' -File -ErrorAction Stop
            Get-ChildItem -Path release -Filter '*.blockmap' -File -ErrorAction Stop
            Get-Item -Path 'release\latest.yml' -ErrorAction Stop
          ) | ForEach-Object { $_.FullName }

          Write-Host 'Release assets:'
          $assets | ForEach-Object { Write-Host " - $_" }

          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag --repo $env:GH_REPO --clobber @assets
          } else {
            gh release create $tag --repo $env:GH_REPO --title "ccNexus $tag" --generate-notes @assets
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release asset upload failed.'
          }
